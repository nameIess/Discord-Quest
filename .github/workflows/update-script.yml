name: Update Quest Script from Gist

on:
  schedule:
    # Every Monday at midnight UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download gist markdown
        run: |
          curl -fsSL \
            "https://gist.githubusercontent.com/aamiaa/204cd9d42013ded9faf646fae7f89fbb/raw" \
            -o gist.md

      - name: Extract JavaScript code block
        run: |
          sed -n '/^```js$/,/^```$/{/^```/d;p}' gist.md > quest-script.js
          rm gist.md
          echo "--- Extracted $(wc -l < quest-script.js) lines ---"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add quest-script.js

          if git diff --cached --quiet; then
            echo "No changes detected — skipping commit."
          else
            git commit -m "chore: auto-update quest script from gist"
            git push
            echo "Committed and pushed updated quest-script.js"
          fi
